name: Release Stable
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Stable release tag to create or update.
                required: true
                default: v2.0.0

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Release:
        name: Build & Release ${{ inputs.tag }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build standalone
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Create installer payload
              run: |
                  mkdir -p package/dist/desktop
                  mkdir -p package/browser

                  cp dist/desktop/patcher.js package/dist/desktop/
                  cp dist/desktop/patcher.js.LEGAL.txt package/dist/desktop/
                  cp dist/desktop/renderer.js package/dist/desktop/
                  cp dist/desktop/renderer.css package/dist/desktop/
                  cp dist/desktop/renderer.js.LEGAL.txt package/dist/desktop/
                  cp dist/deadcord/preload.js package/dist/desktop/preload.js

                  cp deadcord-index.js package/
                  cp deadcord-preload.js package/

                  cp dist/browser/browser.js package/browser/
                  cp dist/browser/browser.css package/browser/
                  cp dist/browser/browser.js.LEGAL.txt package/browser/
                  cp dist/extension-chrome.zip package/browser/ 2>/dev/null || true
                  cp dist/extension-firefox.zip package/browser/ 2>/dev/null || true

                  cp dist/plugins.json package/ 2>/dev/null || true
                  cp dist/equicordplugins.json package/ 2>/dev/null || true
                  cp dist/vencordplugins.json package/ 2>/dev/null || true
                  cp dist/devs.json package/ 2>/dev/null || true

                  cd package
                  zip -r ../deadcord-payload.zip .

            - name: Embed payload in installer
              run: |
                  python3 - <<'PY'
                  import base64
                  import shutil
                  import textwrap
                  from pathlib import Path

                  assets = Path("release-assets")
                  assets.mkdir(exist_ok=True)

                  payload = base64.b64encode(Path("deadcord-payload.zip").read_bytes()).decode()
                  payload = "\n".join(textwrap.wrap(payload, 76))
                  installer = Path("deadcord-install.ps1").read_text(encoding="utf-8")
                  installer = installer.replace("__DEADCORD_PAYLOAD_BASE64__", payload)
                  Path("release-assets/deadcord-install.ps1").write_text(installer, encoding="utf-8", newline="\r\n")

                  for name in ("deadcord-install.bat", "deadcord-uninstall.bat", "deadcord-uninstall.ps1"):
                      shutil.copyfile(name, assets / name)
                  PY

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ inputs.tag }}"
                  zip -j deadcord-install.zip release-assets/deadcord-install.bat release-assets/deadcord-install.ps1
                  zip -j deadcord-uninstall.zip release-assets/deadcord-uninstall.bat release-assets/deadcord-uninstall.ps1
                  mkdir -p deadcord-extension/chrome deadcord-extension/firefox
                  cp -r dist/browser/chromium-unpacked/* deadcord-extension/chrome/
                  cp -r dist/browser/firefox-unpacked/* deadcord-extension/firefox/
                  zip -r deadcord-extension.zip deadcord-extension

                  gh release create "$TAG" --target "$GITHUB_SHA" --title "Deadcord $TAG" --generate-notes 2>/dev/null || true
                  gh release upload "$TAG" --clobber \
                    deadcord-payload.zip \
                    deadcord-install.zip \
                    deadcord-uninstall.zip \
                    deadcord-extension.zip
